name: Build and Release APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        continue-on-error: true

      - name: Build Debug APK
        run: gradle assembleDebug --info --stacktrace --no-daemon -x test -x lint

      - name: Generate Tag
        id: tag_gen
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.sha }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag_name }}
          name: Release ${{ steps.tag_gen.outputs.tag_name }}
          files: app/build/outputs/apk/debug/*.apk
